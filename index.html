		font-weight: 500;

		border-radius: 99px;
		background: rgba(255,255,255,0.30);
		box-shadow: 0 2px 6px rgba(0,0,0,0.45);
		overflow: hidden;

	#boot-fill {
		position: absolute;
		left: 0;
		top: 0;
		bottom: 0;
		width: 0%;
		border-radius: 99px;
		background: #FFFFFF;
		transition: width 180ms linear;

	/* INDETERMINATE — a sliding segment, used when the engine reports total == 0, i.e.
	   when the byte count genuinely is not known.  It slides; it does not fill.  A bar
	   that fills without knowing the total is the lie this file exists to avoid. */
	#boot-track.boot--unknown #boot-fill {
		width: 30%;
		transition: none;
		animation: boot-slide 1.5s ease-in-out infinite;

	@keyframes boot-slide {
		0%   { transform: translateX(-105%); }

	   distinction matters: the download really has finished, and that is the only thing
	   the bar has ever claimed.  What is unknown is the engine work that follows, and a
	   pulse carries "still working" without asserting any fraction of it.  Draining the

		width: 100%;
		animation: boot-pulse 1.25s ease-in-out infinite;

	<script>
/* ============================================================================================
   THE TILT BRIDGE, BECAUSE GODOT'S WEB EXPORT HAS NO SENSORS AT ALL.

   MEASURED on this project's own 4.7.1 export, 2026-08-11 — the whole exported runtime, both
   the JS glue and the wasm:

       gyroscope 0 · accelerometer 0 · gravity 0 · orientation 0 · sensor 0
       deviceorientation/devicemotion in index.wasm: 0

   So `Input.get_gravity()` returns the zero vector forever in a browser. This is NOT the iOS
   permission problem people expect; the sensor is simply not wired on this platform. The owner
   chose tilt as the steering device, and the browser is the only build he has, so without this
   file the control he picked would do exactly nothing and the game would ship claiming otherwise.

   WHAT IT PUBLISHES: `window.__bag_tilt = {x, y, z, ok}` in m/s^2, device axes, the same shape and
   the same units `Input.get_gravity()` would have returned. `game/input/player_input.gd` reads it
   through JavaScriptBridge only when the engine's own sensor is unusable, so native builds are
   untouched and this is a fallback rather than a fork.

   SIGN, AND WHY A GLOBAL FLIP CANNOT HURT: TiltReader measures roll RELATIVE to a neutral it
   captures from this same source, so if a platform reports both x and y inverted, the current
   sample and the neutral invert together and the DELTA is unchanged. A mirror of x ALONE would
   invert the steering, and `TiltReader.INVERT` is the one-line answer to that if the owner reports
   leaning one way and going the other.

   iOS 13+ NEEDS A GESTURE. `DeviceMotionEvent.requestPermission()` must be called from a real user
   gesture or it rejects. The first touch on the page is that gesture; the listener removes itself
   once permission has been answered either way, so a refusal is not re-asked on every tap.
   ============================================================================================ */
(function () {
	window.__bag_tilt = { x: 0, y: 0, z: 0, ok: false };

	function fromMotion(e) {
		const g = e.accelerationIncludingGravity;
		if (!g || g.x === null || g.y === null) return;
		window.__bag_tilt = { x: g.x, y: g.y, z: g.z || 0, ok: true };
	}

	/* Fallback for browsers that fire orientation but not motion: rebuild a gravity vector from
	   beta (front-back) and gamma (left-right). Same axes, same magnitude, so the consumer cannot
	   tell which source it came from. */
	function fromOrientation(e) {
		if (e.beta === null || e.gamma === null) return;
		if (window.__bag_tilt.ok) return;
		const b = e.beta * Math.PI / 180, c = e.gamma * Math.PI / 180;
		const G = 9.81;
		window.__bag_tilt = {
			x: G * Math.sin(c),
			y: -G * Math.sin(b) * Math.cos(c),
			z: G * Math.cos(b) * Math.cos(c),
			ok: true,
		};
	}

	function listen() {
		window.addEventListener('devicemotion', fromMotion, { passive: true });
		window.addEventListener('deviceorientation', fromOrientation, { passive: true });
	}

	const needsGesture = typeof DeviceMotionEvent !== 'undefined'
		&& typeof DeviceMotionEvent.requestPermission === 'function';

	if (!needsGesture) {
		listen();
	} else {
		const ask = function () {
			window.removeEventListener('touchend', ask);
			window.removeEventListener('click', ask);
			DeviceMotionEvent.requestPermission()
				.then(function (state) { if (state === 'granted') listen(); })
				.catch(function () { /* refused or unavailable: bank stays 0, which is honest */ });
		};
		window.addEventListener('touchend', ask, { passive: true });
		window.addEventListener('click', ask);
	}
})();
	</script>

	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":10772256,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};

const engine = new Engine(GODOT_CONFIG);

	const boot = document.getElementById('boot');
	const track = document.getElementById('boot-track');
	const fill = document.getElementById('boot-fill');
	const phase = document.getElementById('boot-phase');
	const sub = document.getElementById('boot-sub');
	const notice = document.getElementById('boot-notice');

	// the moment the last byte lands, and everything after that (WebAssembly compilation
	// finishing, module init, pck copy, callMain, scene build, shader compile) is opaque
	// to this page.  MEASURED 2026-08-10: the download finishes in 3-4 s while the wait
	// the owner reported ran to about a minute, so the silence after the bar fills is the
	// majority of the wait.  This timer estimates nothing; it adds one sentence saying
	// WHY the silence is long, once the silence is long enough to be alarming.  Below
	// ~6 s the sentence flashes past on a fast machine and itself reads as a glitch.
	var COMPILE_HINT_MS = 9000;

	var state = 'download';
	var hintTimer = null;
	var sawBytes = false;

	function enterCompiling() {
		if (state !== 'download') {
			return;
		}
		state = 'compiling';
		// The bar stays — it is the author's composition — full and pulsing, because the
		// download really is complete and what follows is not measurable.
		track.classList.remove('boot--unknown');
		track.classList.add('boot--working');
		fill.style.width = '100%';
		phase.textContent = 'Starting the engine…';
		sub.textContent = 'Unpacking the city';
		hintTimer = window.setTimeout(function () {
			// Honest and specific: name the real work and the real number.  39,513,091
			// bytes of engine binary is what index.wasm actually is — GODOT_CONFIG's own
			// fileSizes carries it — and the browser really is compiling it.
			sub.textContent = 'First run compiles about 40 MB of engine code. This is the slow part.';
		}, COMPILE_HINT_MS);
	}

	function finish() {
		if (state === 'done') {
			return;
		}
		state = 'done';
		if (hintTimer !== null) {
			window.clearTimeout(hintTimer);
		}
		boot.classList.add('boot--gone');
		// Matches the 450 ms CSS transition; the node is removed rather than left
		// invisible so it can never eat a touch aimed at the shape pad.
		window.setTimeout(function () {
			if (boot.parentNode) {
				boot.parentNode.removeChild(boot);
			}

	}

	function displayFailureNotice(err) {
		console.error(err);
		var msg;
		if (err instanceof Error) {
			msg = err.message;
		} else if (typeof err === 'string') {
			msg = err;
		} else {
			msg = 'An unknown error occurred.';
		}
		if (hintTimer !== null) {
			window.clearTimeout(hintTimer);
		}
		state = 'failed';
		while (notice.lastChild) {
			notice.removeChild(notice.lastChild);

	// Both files are registered in the same tick by startGame's Promise.all, so `total`

	function onProgress(current, total) {
		if (state !== 'download') {
			return;

			var frac = current / total;
			fill.style.width = (frac * 100).toFixed(1) + '%';
			phase.textContent = 'Loading life…';
			sub.textContent = Math.floor(frac * 100) + '%';
			if (current >= total) {
				enterCompiling();
			}
		} else {
			// Total unknown, or bytes past total (which cannot happen with the fileSizes
			// this export writes, but if a future export loses them the honest answer is
			// to stop claiming a number — not to clamp at 100% and pretend).
			track.classList.add('boot--unknown');
			phase.textContent = 'Loading life…';
			sub.textContent = 'Downloading';
		}
	}

	// THE SECOND, INDEPENDENT PHASE-2 TRIGGER, and it is not belt-and-braces — the
	// progress callback alone provably does not do the job.
	//
	// MEASURED 2026-08-10, throttled local run at 800 KB/s, tab visible: the last
	// onProgress this page received said 95%, and the next thing that happened was the
	// game starting.  "Starting the engine…" never rendered once.  Preloader.animateProgress
	// is driven by requestAnimationFrame, so the tick that would have reported 100% was
	// still queued behind the WebAssembly compilation that had already begun.
	// MEASURED in the same session, tab hidden: onProgress fired ZERO times across a
	// complete 48.7 s download, because rAF does not run in a hidden tab at all
	// (docs/GODOT_FACTS.md already records the hidden-tab rAF trap for the game loop; it
	// applies to the loader too).  An embedded iframe that starts off-screen is exactly
	// that case.
	//
	// Resource Timing is the honest answer: responseEnd for a same-origin resource is the
	// moment its last byte arrived, it is recorded by the browser rather than by a
	// callback we have to be scheduled to receive, and it keeps working while rAF is
	// suspended.  The files to wait for are read from GODOT_CONFIG.fileSizes rather than
	// hardcoded, so this follows a renamed export automatically.
	var awaiting = Object.keys(GODOT_CONFIG['fileSizes'] || {});

	function noteDownloaded(url) {
		var name = String(url).split('?')[0].split('/').pop();
		var i = awaiting.indexOf(name);
		if (i < 0) {
			return;
		}
		awaiting.splice(i, 1);
		if (awaiting.length === 0) {
			enterCompiling();
		}
	}

	if (awaiting.length > 0 && typeof PerformanceObserver === 'function') {
		try {
			new PerformanceObserver(function (list) {
				list.getEntries().forEach(function (entry) {
					noteDownloaded(entry.name);
				});
			}).observe({ type: 'resource', buffered: true });
		} catch (err) {
			// Old browser, or no 'resource' entry type. The progress callback below is
			// still wired; we simply lose the second trigger. Never fatal.
			console.warn('boot: resource timing unavailable', err);
		}
	}

	var missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
	} else {
		phase.textContent = 'Loading life…';
		sub.textContent = '0%';
		engine.startGame({
			'onProgress': onProgress,
		}).then(function () {
			// Belt and braces: a fully cached load can resolve before the first rAF, so
			// onProgress may never fire.  Land on the finished state either way.
			if (!sawBytes) {
				enterCompiling();
			}
			finish();
		}, displayFailureNotice);
	}
}());
	</script>
</body>
</html>
